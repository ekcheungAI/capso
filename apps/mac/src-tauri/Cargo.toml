[package]
name = "mac"
version = "0.1.0"
description = "Capso — screenshot memory capture client"
authors = ["Elvin Cheung"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri already brings `image` with PNG support; the direct declaration lets
# native drag-out create a bounded preview without adding another codec stack.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Already present transitively through Tauri; declared directly so capture ids
# are real UUIDs at the filesystem and ingest boundary.
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# These bindings expose Apple's own Screen Recording preflight and Login Items
# APIs. They are already in the native Tauri dependency family and do not run
# install scripts or background helpers.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEventSource", "CGEventTypes", "CGWindow"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
# Small native drag-session adapter maintained by the Tauri ecosystem. Its
# macOS dependency family is already present through Tauri/objc2.
drag = "2.1.1"

[dev-dependencies]
tempfile = "3"
