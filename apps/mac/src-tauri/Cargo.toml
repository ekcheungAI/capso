[package]
name = "mac"
version = "0.1.0"
description = "Capso — screenshot memory capture client"
authors = ["Elvin Cheung"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Official Tauri adapter for the installed app's static capso:// callback.
# The native auth parser still validates the exact callback independently.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already present through Tauri's HTTP stack. Declared directly for the native
# PKCE handoff: S256 challenge generation and strict custom-URL parsing.
base64 = "0.22.1"
sha2 = "0.10.9"
url = "2.5.8"
# Also already present transitively. RFC 3339 parsing keeps Rust aligned with
# the shared Zod ingest contract instead of accepting timestamp-shaped garbage.
time = { version = "0.3.54", features = ["parsing"] }
# Tauri already brings `image` with PNG support; the direct declaration lets
# native drag-out create a bounded preview without adding another codec stack.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# GIF export is encoded in-process from bounded Apple AVFoundation frames. It
# does not require or shell out to a separately installed ffmpeg binary.
gif = "0.14.2"
# Already present transitively through Tauri; declared directly so capture ids
# are real UUIDs at the filesystem and ingest boundary.
uuid = { version = "1", features = ["v4"] }
# The queue drain is deliberately synchronous inside Tauri's blocking runtime.
# A bounded blocking client keeps the transport small and prevents network I/O
# from ever running on the capture/UI executor.
reqwest = { version = "0.13.4", features = ["blocking"], default-features = true }

[target.'cfg(target_os = "macos")'.dependencies]
# These bindings expose Apple's own Screen Recording preflight and Login Items
# APIs. They are already in the native Tauri dependency family and do not run
# install scripts or background helpers.
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFNumber", "CFPreferences", "CFPropertyList", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGEventSource", "CGEventTypes", "CGImage", "CGWindow"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
# AVAssetImageGenerator decodes local H.264 through Apple's on-device media
# stack and applies the source track transform before each bounded GIF frame.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetImageGenerator", "AVCaptureDevice", "AVMediaFormat", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
block2 = "0.6.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
# Apple Vision performs accurate multilingual OCR entirely on the device. Only
# the request, handler and observation surfaces needed for PNG history are linked.
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
# Small native drag-session adapter maintained by the Tauri ecosystem. Its
# macOS dependency family is already present through Tauri/objc2.
drag = "2.1.1"
# Small secrets such as the rotating Supabase refresh token belong in the
# user's encrypted login Keychain, never JSON under Application Support.
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
# Apple's route-reachability API lets the background queue wake on reconnect
# without probing a third-party endpoint or touching foreground capture.
system-configuration = "0.7.0"

[dev-dependencies]
tempfile = "3"
