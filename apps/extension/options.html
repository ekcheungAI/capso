<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capso settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf9f5;
        --fg: #141412;
        --muted: #6b6a64;
        --line: rgb(20 20 18 / 0.12);
        --accent: #c2461f;
        --accent-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141412;
          --fg: #ededea;
          --muted: #9a9890;
          --line: rgb(237 237 234 / 0.14);
          --accent: #e8683a;
          --accent-ink: #141412;
        }
      }
      body {
        margin: 0;
        padding: 28px 24px;
        max-width: 34rem;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-size: 18px; letter-spacing: -0.01em; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
      .note { font-size: 12px; color: var(--muted); min-height: 1.4em; }
      .ok { color: var(--accent); }
      hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
      .hint { font-size: 12px; color: var(--muted); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <h1>Capso</h1>
    <p class="sub">Where this extension sends captures.</p>

    <label for="origin">Capso address</label>
    <input id="origin" type="url" placeholder="http://localhost:3000" spellcheck="false" />
    <div class="row">
      <button id="save" type="button">Save</button>
      <span class="note" id="note"></span>
    </div>

    <hr />
    <p class="hint">
      Use <code>http://localhost:3000</code> while running the app locally, or your deployed
      Capso address. Captures are held by the app until it stores them, so they are not lost
      if it is closed when you capture.
    </p>

    <script src="options.js"></script>
  </body>
</html>
