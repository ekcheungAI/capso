[functions.v1-process-screenshot]
enabled = true
# pg_cron calls this internal worker with a Vault-held CAPSO_WORKER_SECRET.
# The function performs its own constant-time header check before any DB access;
# no browser/client JWT is accepted by this endpoint.
verify_jwt = false
import_map = "./functions/v1-process-screenshot/deno.json"
entrypoint = "./functions/v1-process-screenshot/index.ts"

[functions.v1-extension-ingest]
enabled = true
# A paired device code is the credential. The function hashes it before lookup;
# raw device codes are never persisted or logged.
verify_jwt = false
import_map = "./functions/v1-extension-ingest/deno.json"
entrypoint = "./functions/v1-extension-ingest/index.ts"

[functions.v1-share-screenshot]
enabled = true
# Public share tokens are verified inside the function after hashing. Owner
# actions independently verify a permanent Supabase user JWT before service-role access.
verify_jwt = false
import_map = "./functions/v1-share-screenshot/deno.json"
entrypoint = "./functions/v1-share-screenshot/index.ts"
