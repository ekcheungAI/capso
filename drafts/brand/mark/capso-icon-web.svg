<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Capso">
<rect x="0" y="0" width="1024" height="1024" rx="228" fill="#e8683a"/>
<g transform="translate(92,92) scale(35)" color="#fafaf8">
<defs>
    <mask id="capso-eyes">
      <rect x="0" y="0" width="24" height="24" fill="#fff"/>
      <circle cx="9.15" cy="8.2" r="1.65" fill="#000"/>
      <circle cx="14.85" cy="8.2" r="1.65" fill="#000"/>
    </mask>
    <clipPath id="capso-top">
      <rect x="3" y="2" width="18" height="9.725"/>
    </clipPath>
    <clipPath id="capso-bot">
      <rect x="3" y="12.275" width="18" height="9.725"/>
    </clipPath>
  </defs>

  <g fill="currentColor" mask="url(#capso-eyes)">
    <g clip-path="url(#capso-top)">
      <rect x="4" y="3" width="16" height="18" rx="7"/>
    </g>
    <g clip-path="url(#capso-bot)">
      <rect x="4" y="3" width="16" height="18" rx="7"/>
    </g>
  </g>
</g>
</svg>
