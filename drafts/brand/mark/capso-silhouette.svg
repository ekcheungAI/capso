<!--
  Capso — silhouette (single colour, knocked-out eyes, split seam)

  The form the icon set is actually built from. Two changes from the primary mark:

    1. Eyes are HOLES, not dark dots. On a coloured plate a flat fill swallows the
       face entirely — punching through to the plate behind is what keeps it.
    2. The seam becomes a real 0.55-unit gap, so the capsule reads as two halves
       even in one colour. It also echoes the split animation on the overlay.

  Eye radius is 1.65, not the 1.25 the geometry would suggest optically. At r1.25
  a 16px favicon lands the eyes under 2 device pixels and they render as slits
  rather than dots. 1.65 is the smallest radius that still resolves as round at
  16px, and it reads as intentional at every size above.

  currentColor everywhere, so one file serves the cream-on-accent icon, the black
  macOS tray template, and its inverted counterpart.

  Below ~20px the seam gap falls under half a pixel and closes up. That is the
  intended degradation — at that size it should read as one solid capsule.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Capso">
  <defs>
    <mask id="capso-eyes">
      <rect x="0" y="0" width="24" height="24" fill="#fff"/>
      <circle cx="9.15" cy="8.2" r="1.65" fill="#000"/>
      <circle cx="14.85" cy="8.2" r="1.65" fill="#000"/>
    </mask>
    <clipPath id="capso-top">
      <rect x="3" y="2" width="18" height="9.725"/>
    </clipPath>
    <clipPath id="capso-bot">
      <rect x="3" y="12.275" width="18" height="9.725"/>
    </clipPath>
  </defs>

  <g fill="currentColor" mask="url(#capso-eyes)">
    <g clip-path="url(#capso-top)">
      <rect x="4" y="3" width="16" height="18" rx="7"/>
    </g>
    <g clip-path="url(#capso-bot)">
      <rect x="4" y="3" width="16" height="18" rx="7"/>
    </g>
  </g>
</svg>
