name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:node
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deno-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/v1-process-screenshot
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true
      - run: deno task check
      - run: deno task test

  mac-native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all --manifest-path apps/mac/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path apps/mac/src-tauri/Cargo.toml
